name: Build Wails Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-setup.exe
          - os: macos-latest
            platform: darwin/universal
            artifact: motiv2d-mac.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Using stable 1.23 for CI reliability

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # WINDOWS BUILD
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          # -nsis: creates installer
          # -webview2 embed: ensures it launches even if user has a broken webview
          wails build -platform windows/amd64 -nsis -clean -webview2 embed

      - name: Prepare Windows Artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Debug: List everything so we can see what Wails called it
          Get-ChildItem -Path build/bin -Recurse
          
          # Find ANY exe in the bin folder that looks like an installer
          $installer = Get-ChildItem -Path build/bin/*.exe | Where-Object { $_.Name -like "*installer*" -or $_.Name -like "*setup*" } | Select-Object -First 1
          
          if ($null -eq $installer) {
            # Fallback: Just grab the biggest EXE in there
            $installer = Get-ChildItem -Path build/bin/*.exe | Sort-Object Length -Descending | Select-Object -First 1
          }
          
          Copy-Item -Path $installer.FullName -Destination "./${{ matrix.artifact }}"

      # MACOS BUILD
      - name: Build MacOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal -clean

      - name: Create MacOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          # A .app is a FOLDER. You cannot upload a folder to GitHub.
          # This creates a single .dmg file that contains your .app.
          cd build/bin
          APP_NAME=$(ls -d *.app | head -n 1)
          hdiutil create -volname "Motiv2D" -srcfolder "$APP_NAME" -ov -format UDZO ../../${{ matrix.artifact }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Wails Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/arm64
            artifact: motiv2d-macos-arm64.zip
            target_arch: arm64
          - os: macos-latest
            platform: darwin/amd64
            artifact: motiv2d-macos-intel.zip
            target_arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Swift Static Library (macOS Only)
        if: matrix.os == 'macos-latest'
        run: |
          # 1. Compile for ARM64 (Apple Silicon)
          swiftc -c Swift/window_control.swift -o Swift/window_control_arm64.o \
            -target arm64-apple-macos15.0 -parse-as-library
          
          # 2. Compile for x86_64 (Intel)
          swiftc -c Swift/window_control.swift -o Swift/window_control_x86_64.o \
            -target x86_64-apple-macos15.0 -parse-as-library
          
          # 3. Create a Universal (Fat) Object file
          lipo -create Swift/window_control_arm64.o Swift/window_control_x86_64.o \
            -output Swift/window_control.o
          
          # 4. Package into the final static library
          ar rcs Swift/libwindow_control.a Swift/window_control.o
          
          # Verify it contains both architectures
          lipo -info Swift/libwindow_control.a

      - name: Build Wails
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Set target to macOS 15 (Tahoe)
            export MACOSX_DEPLOYMENT_TARGET=15.0
            
            wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w"
            
            # Update Info.plist with Tahoe-specific modern UI keys
            PLIST_PATH="build/bin/motiv2d.app/Contents/Info.plist"
            
            plutil -replace LSMinimumSystemVersion -string "15.0.0" "$PLIST_PATH"
            plutil -replace NSRequiresAquaSystemAppearance -bool false "$PLIST_PATH"
            
            # This triggers the modern "Liquid Glass" titlebar behavior
            plutil -insert NSWindowSupportsAutomaticInlineTitle -bool true "$PLIST_PATH" || \
            plutil -replace NSWindowSupportsAutomaticInlineTitle -bool true "$PLIST_PATH"

            echo "macOS build for ${{ matrix.platform }} finalized with Swift Bridge and Tahoe UI."
          else
            wails build -platform ${{ matrix.platform }} -o motiv2d-standard.exe -clean -ldflags "-s -w" -webview2 embed
            wails build -platform ${{ matrix.platform }} -o motiv2d-frameless.exe -ldflags "-s -w -X main.FramelessMode=true" -webview2 embed
          fi

      - name: MacOS Signing & Packaging
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          chmod +x motiv2d.app/Contents/MacOS/motiv2d
          # Deep sign is mandatory for manual plist edits to be respected by the OS
          codesign --force --deep --sign - motiv2d.app
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Windows Zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/bin/motiv2d-standard.exe", "build/bin/motiv2d-frameless.exe" -DestinationPath "./${{ matrix.artifact }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            motiv2d-windows.zip
            motiv2d-macos-arm64.zip
            motiv2d-macos-intel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
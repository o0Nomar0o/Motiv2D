name: Build Wails Multi-Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # WINDOWS BUILD PROCESS
      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          wails build -platform windows/amd64 -nsis -clean

      - name: Prepare Windows Artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # This finds whatever the installer is named and renames it cleanly
          mv build/bin/*installer.exe motiv2d-setup.exe

      # MACOS BUILD PROCESS
      - name: Build MacOS App
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal -clean

      - name: Create MacOS DMG (Proper Format)
        if: matrix.os == 'macos-latest'
        run: |
          # hdiutil is the built-in Mac tool to create a "proper" installer image
          # We take the .app folder and turn it into a single .dmg file
          cd build/bin
          APP_NAME=$(ls -d *.app)
          hdiutil create -volname "Motiv2D" -srcfolder "$APP_NAME" -ov -format UDZO ../../motiv2d-mac.dmg

      # FINAL RELEASE
      - name: Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            motiv2d-setup.exe
            motiv2d-mac.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
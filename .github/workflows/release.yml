name: Wails Production Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/universal
            artifact: motiv2d-macos.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # --- CRITICAL STEP: Build the Frontend first ---
      - name: Build Frontend Assets
        run: |
          cd frontend
          npm install
          npm run build
          
      # --- DEBUG: Verify index.html exists before Wails starts ---
      - name: Verify Frontend Dist
        shell: bash
        run: |
          if [ -f "frontend/dist/index.html" ]; then
            echo "✅ index.html found. Ready to embed."
          else
            echo "❌ ERROR: frontend/dist/index.html NOT FOUND!"
            ls -R frontend
            exit 1
          fi

      # --- WINDOWS BUILD ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Webview2 embed is the safest way to ensure it opens on all Win11/10
          wails build -platform windows/amd64 -clean -webview2 embed -ldflags "-s -w -H=windowsgui"
          Compress-Archive -Path "build/bin/motiv2d.exe" -DestinationPath "./${{ matrix.artifact }}"

      # --- MACOS BUILD ---
      - name: Build MacOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal -clean -ldflags "-s -w"
          
          # Ad-hoc sign to prevent the "Damaged" error
          cd build/bin
          codesign --force --deep --sign - motiv2d.app
          
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
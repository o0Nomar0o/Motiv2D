name: Wails Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/universal
            artifact: motiv2d-macos.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Wails
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # 1. Set the linker target so the binary itself knows it's modern
            export MACOSX_DEPLOYMENT_TARGET=11.0
            
            # 2. Run the build
            wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w"
            
            # 3. FORCE THE PLIST UPDATE inside the actual .app bundle
            # This is the "magic" that enables rounded corners and new UI
            PLIST_PATH="build/bin/motiv2d.app/Contents/Info.plist"
            
            plutil -replace LSMinimumSystemVersion -string "11.0.0" "$PLIST_PATH"
            plutil -insert NSRequiresAquaSystemAppearance -bool false "$PLIST_PATH" || \
            plutil -replace NSRequiresAquaSystemAppearance -bool false "$PLIST_PATH"
            
            echo "Final Info.plist updated for modern macOS appearance."
          else
            wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w" -webview2 embed
          fi

      - name: MacOS Signing & Packaging
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          chmod +x motiv2d.app/Contents/MacOS/motiv2d
          # Deep signing is required for Tahoe to accept the new corner radius
          codesign --force --deep --sign - motiv2d.app
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Windows Zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/bin/motiv2d.exe" -DestinationPath "./${{ matrix.artifact }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
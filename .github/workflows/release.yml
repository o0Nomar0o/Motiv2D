name: Build Wails Multi-Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: motiv2d-windows.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: motiv2d-linux
          - os: macos-latest
            platform: darwin/universal
            artifact_name: motiv2d-mac.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Build Wails App
        run: |
          # We use -clean to ensure no local cache interference
          wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w"

      - name: Generate Checksum JSON
        shell: bash
        run: |
          cd build/bin
          # Identify the binary (ignores any existing json files)
          FILENAME=$(ls | grep -v .json | head -n 1)
          
          # Calculate Hash (works on Mac, Linux, and Git Bash on Windows)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            SHA=$(sha256sum "$FILENAME" | awk '{print $1}')
          else
            SHA=$(shasum -a 256 "$FILENAME" | awk '{print $1}')
          fi
          
          # Construct the SHA256 JSON
          echo "{\"filename\": \"$FILENAME\", \"sha256\": \"$SHA\", \"platform\": \"${{ matrix.platform }}\", \"build_date\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > sha256.json
          
          # Move to root for easier upload steps
          mv "$FILENAME" "../../${{ matrix.artifact_name }}"
          mv sha256.json "../../${{ matrix.artifact_name }}.sha256.json"

      - name: Release Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
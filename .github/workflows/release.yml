name: Build Wails Multi-Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            # We will generate an installer for Windows
            artifact_name: motiv2d-setup.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: motiv2d-linux
          - os: macos-latest
            platform: darwin/universal
            artifact_name: motiv2d-mac.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Build Wails App (Windows)
        if: matrix.os == 'windows-latest'
        # -nsis creates a setup installer which is much more reliable
        run: |
          wails build -platform windows/amd64 -nsis -clean

      - name: Build Wails App (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: |
          wails build -platform ${{ matrix.platform }} -clean

      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Move the NSIS installer to the artifact name
          mv build/bin/*-installer.exe ${{ matrix.artifact_name }}

      - name: Prepare Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mv build/bin/motiv2d ${{ matrix.artifact_name }}

      - name: Prepare Artifacts (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r ../../${{ matrix.artifact_name }} *.app

      - name: Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            motiv2d-setup.exe
            motiv2d-linux
            motiv2d-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Wails Multi-Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: motiv2d-windows.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: motiv2d-linux
          - os: macos-latest
            platform: darwin/universal
            artifact_name: motiv2d-mac.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Build Wails App
        # Removed -package. Standard build embeds assets by default.
        run: |
          wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w"

      - name: Prepare Artifacts (Windows/Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          # Wails outputs to build/bin. We find the file and move it to a clear name.
          ls -R build/bin
          cp build/bin/*.exe ${{ matrix.artifact_name }} || cp build/bin/motiv2d ${{ matrix.artifact_name }} || true

      - name: Prepare Artifacts (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Mac .app is a folder. Zip is mandatory for GitHub Releases.
          cd build/bin
          zip -r ../../motiv2d-mac.zip *.app

      - name: Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            motiv2d-windows.exe
            motiv2d-linux
            motiv2d-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Wails Production Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/universal
            artifact: motiv2d-macos.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # --- THIS IS THE MISSING FIX ---
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build  # This creates the dist/index.html Wails needs
          
      # --- WINDOWS BUILD ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -clean -webview2 embed -ldflags "-s -w -H=windowsgui"
          Compress-Archive -Path "build/bin/motiv2d.exe" -DestinationPath "./${{ matrix.artifact }}"

      # --- MACOS BUILD ---
      - name: Build MacOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal -clean -ldflags "-s -w"
          
          # 1. Ensure the binary is executable inside the bundle
          chmod +x build/bin/motiv2d.app/Contents/MacOS/motiv2d
          
          # 2. Ad-hoc sign to prevent "Damaged" error
          cd build/bin
          codesign --force --deep --sign - motiv2d.app
          
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
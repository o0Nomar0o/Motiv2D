name: Wails Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/arm64
            artifact: motiv2d-macos-arm64.zip
          - os: macos-latest
            platform: darwin/amd64
            artifact: motiv2d-macos-intel.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Wails
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Ensure Tahoe/macOS 15+ compatibility
            export MACOSX_DEPLOYMENT_TARGET=11.0
            
            wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w"
            
            # Injecting Tahoe/Modern API keys into Info.plist
            PLIST_PATH="build/bin/motiv2d.app/Contents/Info.plist"
            
            # Forces the rounded corner radius and modern window controls
            plutil -replace LSMinimumSystemVersion -string "11.0.0" "$PLIST_PATH"
            plutil -replace NSRequiresAquaSystemAppearance -bool false "$PLIST_PATH"
            
            # Explicitly force DarkAqua appearance at the OS level
            plutil -insert NSAppearanceName -string "NSAppearanceNameDarkAqua" "$PLIST_PATH" || \
            plutil -replace NSAppearanceName -string "NSAppearanceNameDarkAqua" "$PLIST_PATH"
            
            echo "macOS build for ${{ matrix.platform }} completed with Tahoe appearance keys."
          else
            # 1. Build Standard Windows version
            wails build -platform ${{ matrix.platform }} -o motiv2d-standard.exe -clean -ldflags "-s -w" -webview2 embed
            
            # 2. Build Frameless Windows version (Injecting string via ldflags)
            wails build -platform ${{ matrix.platform }} -o motiv2d-frameless.exe -ldflags "-s -w -X main.FramelessMode=true" -webview2 embed
          fi

      - name: MacOS Signing & Packaging
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          chmod +x motiv2d.app/Contents/MacOS/motiv2d
          # Deep sign is mandatory to validate the modified Info.plist on Tahoe
          codesign --force --deep --sign - motiv2d.app
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Windows Zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Zips both versions together for Windows users
          Compress-Archive -Path "build/bin/motiv2d-standard.exe", "build/bin/motiv2d-frameless.exe" -DestinationPath "./${{ matrix.artifact }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            motiv2d-windows.zip
            motiv2d-macos-arm64.zip
            motiv2d-macos-intel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Independent Wails Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/universal # Universal works on both Intel and M1/M2/M3
            artifact: motiv2d-macos.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # WINDOWS: Static Linking to avoid "Missing DLL" errors
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # -trimpath makes the binary more portable
          # -webview2 embed makes sure it doesn't need an external installer
          wails build -platform windows/amd64 -clean -webview2 embed -ldflags "-s -w -H=windowsgui" -trimpath
          
          cd build/bin
          Compress-Archive -Path "motiv2d.exe" -DestinationPath "../../${{ matrix.artifact }}"

      # MAC: Ad-hoc signing to prevent the "Damaged" error
      - name: Build MacOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal -clean -ldflags "-s -w"
          
          # This is the "Magic Fix" for Mac users. 
          # It "Ad-hoc" signs the app so MacOS doesn't think it's corrupted.
          cd build/bin
          codesign --force --deep --sign - motiv2d.app
          
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Wails Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/universal
            artifact: motiv2d-macos.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # THIS IS REQUIRED so go:embed has files to grab
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Wails
        run: |
          wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w" -webview2 embed

      - name: MacOS Signing
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          # Ad-hoc sign so the app isn't "Damaged"
          codesign --force --deep --sign - motiv2d.app
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Windows Zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/bin/motiv2d.exe" -DestinationPath "./${{ matrix.artifact }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Wails Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-setup.exe
          - os: macos-latest
            platform: darwin/universal
            artifact: motiv2d-mac.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Reliable version for Wails v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # WINDOWS BUILD
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          wails build -platform windows/amd64 -nsis -clean -webview2 embed

      - name: Prepare Windows Artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Finds the installer regardless of its specific name and renames it
          $file = Get-ChildItem -Path build/bin/*-installer.exe | Select-Object -First 1
          Move-Item -Path $file.FullName -Destination "./${{ matrix.artifact }}"

      # MACOS BUILD
      - name: Build MacOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal -clean

      - name: Create MacOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          # You cannot upload a .app folder to GitHub. It must be a single file.
          # A DMG is the professional way to package a .app for Mac.
          cd build/bin
          APP_NAME=$(ls -d *.app)
          hdiutil create -volname "Motiv2D" -srcfolder "$APP_NAME" -ov -format UDZO ../../${{ matrix.artifact }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
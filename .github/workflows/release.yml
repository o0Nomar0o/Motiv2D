name: Wails Build

on:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
          - os: macos-latest
            platform: darwin/arm64
            artifact: macos-arm64
          - os: macos-latest
            platform: darwin/amd64
            artifact: macos-intel

    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
		# Using v2.11.0 as requested
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Swift Static Library (macOS Only)
        if: matrix.os == 'macos-latest'
        run: |
          swiftc -c macos/window_control.swift -o macos/window_control_arm64.o -target arm64-apple-macos15.0 -parse-as-library
          swiftc -c macos/window_control.swift -o macos/window_control_x86_64.o -target x86_64-apple-macos15.0 -parse-as-library
          lipo -create macos/window_control_arm64.o macos/window_control_x86_64.o -output macos/window_control.o
          ar rcs macos/libwindow_control.a macos/window_control.o
        
      - name: Build Wails
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            export MACOSX_DEPLOYMENT_TARGET=15.0
            wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w"
            
            PLIST_PATH="build/bin/motiv2d.app/Contents/Info.plist"
            plutil -replace LSMinimumSystemVersion -string "15.0.0" "$PLIST_PATH" |

| true
            plutil -replace NSRequiresAquaSystemAppearance -bool false "$PLIST_PATH" |

| true
            plutil -replace NSWindowSupportsAutomaticInlineTitle -bool true "$PLIST_PATH" |

| true
          else
            # Windows: Build the standard binaries (uses Embed/Evergreen strategy)
            wails build -platform ${{ matrix.platform }} -o motiv2d-standard.exe -clean -ldflags "-s -w" -webview2 embed -devtools
            wails build -platform ${{ matrix.platform }} -o motiv2d-frameless.exe -ldflags "-s -w -X 'main.FramelessMode=true'" -webview2 embed
          fi

      - name: Bundle Fixed Version Runtime (Windows Only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $url = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/8d7d9e58-5939-4512-b0f3-f3b459ffb8f1/Microsoft.WebView2.FixedVersionRuntime.145.0.3800.70.x64.cab"
          Write-Host "Downloading Fixed Version Runtime..."
          Invoke-WebRequest -Uri $url -OutFile "wv2.cab"
          
          Write-Host "Extracting CAB..."
          # The -F:* flag is required to extract the full folder structure 
          mkdir build/bin/wv2runtime
          expand wv2.cab -F:* build/bin/wv2runtime

      - name: Package & Generate Hash
        id: package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cd build/bin
            chmod +x motiv2d.app/Contents/MacOS/motiv2d
            codesign --force --deep --sign - motiv2d.app
            zip -r../../motiv2d-${{ matrix.artifact }}.zip motiv2d.app
          else
            # 1. Standard Downloads (Embed mode)
            powershell -Command "Compress-Archive -Path 'build/bin/motiv2d-standard.exe' -DestinationPath './motiv2d-windows-standard.zip'"
            powershell -Command "Compress-Archive -Path 'build/bin/motiv2d-frameless.exe' -DestinationPath './motiv2d-windows-frameless.zip'"
            
            # 2. Bundled Downloads (Fixed Version mode)
            # These zips MUST include the wv2runtime folder alongside the executable [1, 2]
            powershell -Command "Compress-Archive -Path 'build/bin/motiv2d-standard.exe', 'build/bin/wv2runtime' -DestinationPath './motiv2d-windows-bundled-standard.zip'"
            powershell -Command "Compress-Archive -Path 'build/bin/motiv2d-frameless.exe', 'build/bin/wv2runtime' -DestinationPath './motiv2d-windows-bundled-frameless.zip'"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate update.json
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          
          gh release download $VERSION --pattern "*.zip"
          
          WIN_STD_HASH=$(shasum -a 256 motiv2d-windows-standard.zip | awk '{print $1}')
          WIN_FRM_HASH=$(shasum -a 256 motiv2d-windows-frameless.zip | awk '{print $1}')
          WIN_BND_STD_HASH=$(shasum -a 256 motiv2d-windows-bundled-standard.zip | awk '{print $1}')
          WIN_BND_FRM_HASH=$(shasum -a 256 motiv2d-windows-bundled-frameless.zip | awk '{print $1}')
          MAC_ARM_HASH=$(shasum -a 256 motiv2d-macos-arm64.zip | awk '{print $1}')
          MAC_INTEL_HASH=$(shasum -a 256 motiv2d-macos-intel.zip | awk '{print $1}')

          cat <<EOF > update.json
          {
            "version": "$VERSION_NUM",
            "platforms": {
              "windows_standard_amd64": {
                "url": "https://github.com/o0Nomar0o/Motiv2D/releases/download/$VERSION/motiv2d-windows-standard.zip",
                "checksum": "$WIN_STD_HASH"
              },
              "windows_frameless_amd64": {
                "url": "https://github.com/o0Nomar0o/Motiv2D/releases/download/$VERSION/motiv2d-windows-frameless.zip",
                "checksum": "$WIN_FRM_HASH"
              },
              "windows_bundled_standard_amd64": {
                "url": "https://github.com/o0Nomar0o/Motiv2D/releases/download/$VERSION/motiv2d-windows-bundled-standard.zip",
                "checksum": "$WIN_BND_STD_HASH"
              },
              "windows_bundled_frameless_amd64": {
                "url": "https://github.com/o0Nomar0o/Motiv2D/releases/download/$VERSION/motiv2d-windows-bundled-frameless.zip",
                "checksum": "$WIN_BND_FRM_HASH"
              },
              "darwin_arm64": {
                "url": "https://github.com/o0Nomar0o/Motiv2D/releases/download/$VERSION/motiv2d-macos-arm64.zip",
                "checksum": "$MAC_ARM_HASH"
              },
              "darwin_amd64": {
                "url": "https://github.com/o0Nomar0o/Motiv2D/releases/download/$VERSION/motiv2d-macos-intel.zip",
                "checksum": "$MAC_INTEL_HASH"
              }
            }
          }
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update manifest to ${{ github.ref_name }}"
          git pull origin main --rebase
          git push origin main
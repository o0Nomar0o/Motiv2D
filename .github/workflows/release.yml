name: Wails Production Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: motiv2d-windows.zip
          - os: macos-latest
            platform: darwin/universal
            artifact: motiv2d-macos.zip

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # WINDOWS FIX: Embed WebView2 so it doesn't rely on the user's system version
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -clean -webview2 embed -ldflags "-s -w -H=windowsgui"
          Compress-Archive -Path "build/bin/motiv2d.exe" -DestinationPath "./${{ matrix.artifact }}"

      # MACOS FIX: Ad-hoc sign the app so it's not "Damaged"
      - name: Build MacOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal -clean -ldflags "-s -w"
          
          # This is the crucial step you were missing:
          # It signs the app with a 'null' identity so MacOS treats it as 
          # an 'Unknown Developer' app instead of a 'Damaged' app.
          cd build/bin
          codesign --force --deep --sign - motiv2d.app
          
          zip -r ../../${{ matrix.artifact }} motiv2d.app

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}